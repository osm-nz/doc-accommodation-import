name: Sync

on:
  push:
    branches:
      - main
  schedule:
    - cron: "19 19 19 * *" # on the 19th of each month
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26.x

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm start
        env:
          API_V1_KEY: ${{ secrets.API_V1_KEY }}

      - uses: actions/upload-pages-artifact@v3
        id: deployment
        with:
          path: output/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: sync
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
